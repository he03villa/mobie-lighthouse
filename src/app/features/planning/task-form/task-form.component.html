<ion-header class="lh-page-header lh-header-planning" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/planning"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar tarea' : 'Nueva tarea' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    <div class="lh-field">
      <label class="lh-field__label">Titulo</label>
      <div class="lh-field__control">
        <ion-input
          [(ngModel)]="title"
          placeholder="Nombre de la tarea"
        ></ion-input>
      </div>
    </div>

    <div class="lh-field">
      <label class="lh-field__label">Descripcion</label>
      <div class="lh-field__control">
        <ion-textarea
          [(ngModel)]="description"
          placeholder="Descripcion opcional"
          rows="4"
        ></ion-textarea>
      </div>
    </div>

    <div class="lh-field">
      <label class="lh-field__label">Fecha de inicio</label>
      <div class="lh-field__control">
        <ion-input
          type="date"
          [(ngModel)]="startDate"
        ></ion-input>
      </div>
    </div>

    <div class="lh-field">
      <label class="lh-field__label">Fecha de vencimiento</label>
      <div class="lh-field__control">
        <ion-input
          type="date"
          [(ngModel)]="dueDate"
        ></ion-input>
      </div>
    </div>

    <ion-button
      expand="block"
      class="save-btn"
      (click)="save()"
      [disabled]="loading || !title.trim()"
    >
      <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
      {{ isEdit ? 'Actualizar tarea' : 'Crear tarea' }}
    </ion-button>
  </div>
</ion-content>
