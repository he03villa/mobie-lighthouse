<ion-content [fullscreen]="true">
  <div class="login-page">
    <!-- Hero -->
    <div class="hero">
      <div class="hero__bg"></div>
      <div class="hero__content">
        <div class="brand-icon-wrap">
          <ion-icon name="flash-outline" class="brand-icon"></ion-icon>
        </div>
        <h1 class="brand-name">Lighthouse</h1>
        <p class="brand-tagline">Sistema de Gestion Educativa</p>
      </div>
    </div>

    <!-- Form Card -->
    <div class="form-card">
      <h2 class="form-card__title">Bienvenido de vuelta</h2>
      <p class="form-card__subtitle">Ingresa tus credenciales para continuar</p>

      <form (ngSubmit)="login()">
        <div class="lh-field">
          <label class="lh-field__label">Correo electronico</label>
          <div class="lh-field__control">
            <ion-input
              type="email"
              [(ngModel)]="email"
              name="email"
              autocomplete="email"
              placeholder="tu@email.com"
            ></ion-input>
          </div>
        </div>

        <div class="lh-field">
          <label class="lh-field__label">Contrasena</label>
          <div class="lh-field__control">
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              placeholder="Minimo 8 caracteres"
            ></ion-input>
            <button
              class="password-toggle"
              type="button"
              (click)="togglePassword(); $event.stopPropagation()"
              tabindex="-1"
            >
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <div class="error-banner">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span>{{ errorMessage }}</span>
          </div>
        }

        <a class="forgot-link" (click)="goToForgotPassword()">¿Olvidaste tu contraseña?</a>

        <button class="login-btn" type="submit" [disabled]="loading">
          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
            <span>Iniciando sesion...</span>
          } @else {
            <span>Iniciar Sesion</span>
            <ion-icon name="arrow-forward-outline"></ion-icon>
          }
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      <p>No tienes cuenta? <a (click)="goToRegister()">Registrate</a></p>
    </div>
  </div>
</ion-content>
