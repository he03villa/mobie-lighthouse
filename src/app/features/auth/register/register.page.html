<ion-content [fullscreen]="true">
  <div class="auth-container">
    <div class="auth-brand">
      <ion-icon name="flash-outline" class="brand-icon"></ion-icon>
      <h1 class="brand-title">Lighthouse</h1>
      <p class="brand-subtitle">Crear tu cuenta</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot" [class.active]="step >= 1"></div>
      <div class="step-dot" [class.active]="step >= 2"></div>
    </div>

    <form class="auth-form" (ngSubmit)="step === 1 ? nextStep() : register()">

      <!-- Step 1 -->
      <ng-container *ngIf="step === 1">
        <div class="lh-field">
          <label class="lh-field__label">Nombre completo</label>
          <div class="lh-field__control">
            <ion-input
              [(ngModel)]="name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Tu nombre"
            ></ion-input>
          </div>
        </div>

        <div class="lh-field">
          <label class="lh-field__label">Correo electronico</label>
          <div class="lh-field__control">
            <ion-input
              [(ngModel)]="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="tu@email.com"
            ></ion-input>
          </div>
        </div>

        <div class="lh-field">
          <label class="lh-field__label">Contrasena</label>
          <div class="lh-field__control">
            <ion-input
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Minimo 8 caracteres"
            ></ion-input>
            <button
              class="password-toggle"
              type="button"
              (click)="togglePassword(); $event.stopPropagation()"
              tabindex="-1"
            >
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </button>
          </div>
        </div>

        <div class="lh-field">
          <label class="lh-field__label">Confirmar contrasena</label>
          <div class="lh-field__control">
            <ion-input
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Repite tu contrasena"
            ></ion-input>
          </div>
        </div>

        <ion-button
          expand="block"
          type="submit"
          class="auth-button"
        >
          Siguiente
        </ion-button>
      </ng-container>

      <!-- Step 2 -->
      <ng-container *ngIf="step === 2">
        <div class="lh-field">
          <label class="lh-field__label">Nombre de la Organizacion</label>
          <div class="lh-field__control">
            <ion-input
              [(ngModel)]="tenantName"
              name="tenantName"
              type="text"
              autocomplete="organization"
              placeholder="Opcional — puedes agregarlo despues"
            ></ion-input>
          </div>
        </div>

        <ion-button
          expand="block"
          type="submit"
          class="auth-button"
          [disabled]="loading"
        >
          <ion-spinner *ngIf="loading" name="crescent" class="button-spinner"></ion-spinner>
          <span *ngIf="!loading">Crear cuenta</span>
        </ion-button>

        <ion-button
          expand="block"
          fill="clear"
          type="button"
          class="auth-button-secondary"
          (click)="goBack()"
          [disabled]="loading"
        >
          Atras
        </ion-button>
      </ng-container>
    </form>

    <div class="auth-error" *ngIf="errorMessage">
      <ion-text color="danger">{{ errorMessage }}</ion-text>
    </div>

    <div class="auth-footer">
      <ion-text color="medium">
        Ya tienes una cuenta?
        <a (click)="goToLogin()" class="auth-link">Iniciar sesion</a>
      </ion-text>
    </div>
  </div>
</ion-content>
