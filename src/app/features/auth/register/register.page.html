<ion-content [fullscreen]="true">
  <div class="auth-container">
    <div class="auth-brand">
      <ion-icon name="flash-outline" class="brand-icon"></ion-icon>
      <h1 class="brand-title">Lighthouse</h1>
      <p class="brand-subtitle">Crear tu cuenta</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot" [class.active]="step >= 1"></div>
      <div class="step-dot" [class.active]="step >= 2"></div>
    </div>

    <form class="auth-form" (ngSubmit)="step === 1 ? nextStep() : register()">

      <!-- Step 1 -->
      <ng-container *ngIf="step === 1">
        <div class="form-group">
          <ion-item lines="none" class="auth-input">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-label position="floating">Nombre completo</ion-label>
            <ion-input
              [(ngModel)]="name"
              name="name"
              type="text"
              autocomplete="name"
            ></ion-input>
          </ion-item>
        </div>

        <div class="form-group">
          <ion-item lines="none" class="auth-input">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-label position="floating">Correo electrónico</ion-label>
            <ion-input
              [(ngModel)]="email"
              name="email"
              type="email"
              autocomplete="email"
            ></ion-input>
          </ion-item>
        </div>

        <div class="form-group">
          <ion-item lines="none" class="auth-input">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              type="button"
              (click)="togglePassword()"
              class="password-toggle"
            >
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
                slot="icon-only"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <div class="form-group">
          <ion-item lines="none" class="auth-input">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-label position="floating">Confirmar contraseña</ion-label>
            <ion-input
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
            ></ion-input>
          </ion-item>
        </div>

        <ion-button
          expand="block"
          type="submit"
          class="auth-button"
        >
          Siguiente
        </ion-button>
      </ng-container>

      <!-- Step 2 -->
      <ng-container *ngIf="step === 2">
        <div class="form-group">
          <ion-item lines="none" class="auth-input">
            <ion-icon name="business-outline" slot="start"></ion-icon>
            <ion-label position="floating">Nombre de la Organización</ion-label>
            <ion-input
              [(ngModel)]="tenantName"
              name="tenantName"
              type="text"
              autocomplete="organization"
            ></ion-input>
          </ion-item>
          <ion-note class="field-hint">Opcional — puedes agregarlo después</ion-note>
        </div>

        <ion-button
          expand="block"
          type="submit"
          class="auth-button"
          [disabled]="loading"
        >
          <ion-spinner *ngIf="loading" name="crescent" class="button-spinner"></ion-spinner>
          <span *ngIf="!loading">Crear cuenta</span>
        </ion-button>

        <ion-button
          expand="block"
          fill="clear"
          type="button"
          class="auth-button-secondary"
          (click)="goBack()"
          [disabled]="loading"
        >
          Atrás
        </ion-button>
      </ng-container>
    </form>

    <div class="auth-error" *ngIf="errorMessage">
      <ion-text color="danger">{{ errorMessage }}</ion-text>
    </div>

    <div class="auth-footer">
      <ion-text color="medium">
        ¿Ya tienes una cuenta?
        <a (click)="goToLogin()" class="auth-link">Iniciar sesión</a>
      </ion-text>
    </div>
  </div>
</ion-content>
