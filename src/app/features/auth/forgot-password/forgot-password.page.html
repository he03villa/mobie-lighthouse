<ion-header class="lh-page-header lh-header-auth" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    @if (!sent) {
      <div class="header-section">
        <div class="icon-circle">
          <ion-icon name="key-outline"></ion-icon>
        </div>
        <h1>¿Olvidaste tu contraseña?</h1>
        <p>Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecerla.</p>
      </div>

      <div class="form-section">
        <div class="lh-field">
          <label class="lh-field__label">Correo electrónico</label>
          <div class="lh-field__control">
            <ion-input
              type="email"
              [(ngModel)]="email"
              placeholder="tu@correo.com"
              [disabled]="loading"
            ></ion-input>
          </div>
        </div>

        <button class="submit-btn" (click)="submit()" [disabled]="loading || !email.trim()">
          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
            <span>Enviando...</span>
          } @else {
            <ion-icon name="send-outline"></ion-icon>
            <span>Enviar instrucciones</span>
          }
        </button>
      </div>
    } @else {
      <div class="success-section">
        <div class="icon-circle icon-circle--success">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <h1>Correo enviado</h1>
        <p>Revisa tu bandeja de entrada y sigue las instrucciones para restablecer tu contraseña.</p>
        <button class="submit-btn" (click)="goToLogin()">
          Volver al login
        </button>
      </div>
    }
  </div>
</ion-content>
