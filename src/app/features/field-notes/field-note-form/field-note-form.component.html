<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/field-notes"></ion-back-button>
    </ion-buttons>
    <ion-title>Nueva nota de campo</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent" slot="end"></ion-spinner>
        }
        Guardar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    <div class="surface-panel">
      <div class="lh-field">
        <label class="lh-field__label">ID del participante</label>
        <div class="lh-field__control">
          <ion-input
            [(ngModel)]="participantId"
            placeholder="UUID del participante"
            [disabled]="loading"
          ></ion-input>
        </div>
      </div>

      <div class="lh-field">
        <label class="lh-field__label">Contenido</label>
        <div class="lh-field__control">
          <ion-textarea
            [(ngModel)]="content"
            placeholder="Escribe tu nota de campo..."
            [rows]="5"
            [disabled]="loading"
          ></ion-textarea>
        </div>
      </div>

      <div class="lh-field">
        <label class="lh-field__label">Visibilidad</label>
        <div class="lh-field__control">
          <ion-select [(ngModel)]="visibility" [disabled]="loading">
            <ion-select-option value="private">Privada</ion-select-option>
            <ion-select-option value="shared_family">Compartir con familia</ion-select-option>
            <ion-select-option value="shared_participant">Compartir con participante</ion-select-option>
            <ion-select-option value="public">Publica</ion-select-option>
          </ion-select>
        </div>
      </div>

      <div class="lh-field">
        <label class="lh-field__label">Fecha de sesion</label>
        <div class="lh-field__control">
          <ion-input
            type="date"
            [(ngModel)]="sessionDate"
            [disabled]="loading"
          ></ion-input>
        </div>
      </div>

      <ion-button
        expand="block"
        class="save-btn"
        (click)="save()"
        [disabled]="loading"
      >
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        Guardar nota
      </ion-button>
    </div>
  </div>
</ion-content>
