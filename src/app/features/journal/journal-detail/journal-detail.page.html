<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/journal"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="editEntry()">
        <ion-icon name="create-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="deleteEntry()">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-loading-spinner *ngIf="loading" message="Cargando entrada..."></app-loading-spinner>

  <div *ngIf="!loading && entry" class="page">
    <div class="detail-date">{{ formatDate(entry.entry_date || entry.created_at) }}</div>

    <div class="detail-visibility">
      <ion-badge [class]="'visibility-badge visibility-' + entry.visibility">
        <ion-icon [name]="getVisibilityIcon()"></ion-icon>
        {{ getVisibilityLabel() }}
      </ion-badge>
    </div>

    <div class="detail-author" *ngIf="entry.author">
      <span class="author-label">Autor</span>
      <span class="author-name">{{ entry.author.name }}</span>
    </div>

    <ion-card class="detail-card">
      <ion-card-content>
        <p class="detail-content">{{ entry.content }}</p>
      </ion-card-content>
    </ion-card>

    <div class="detail-participant" *ngIf="entry.participant">
      <span class="participant-label">Participante</span>
      <span class="participant-name">{{ entry.participant.full_name }}</span>
    </div>
  </div>
</ion-content>
