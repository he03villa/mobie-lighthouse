<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/journal"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar entrada' : 'Nueva entrada' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [disabled]="loading || !content.trim()">
        <ion-spinner *ngIf="loading" name="crescent" slot="icon-only"></ion-spinner>
        <span *ngIf="!loading">Guardar</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    <div class="lh-field">
      <label class="lh-field__label">Contenido</label>
      <div class="lh-field__control">
        <ion-textarea
          [(ngModel)]="content"
          placeholder="Escribe tu entrada del diario..."
          rows="8"
        ></ion-textarea>
      </div>
    </div>

    <div class="lh-field">
      <label class="lh-field__label">Visibilidad</label>
      <div class="lh-field__control">
        <ion-select [(ngModel)]="visibility">
          <ion-select-option value="private">Privada</ion-select-option>
          <ion-select-option value="shared_family">Compartida con la familia</ion-select-option>
          <ion-select-option value="shared_participant">Compartida con el participante</ion-select-option>
          <ion-select-option value="public">Publica</ion-select-option>
        </ion-select>
      </div>
    </div>

    <div class="lh-field">
      <label class="lh-field__label">Fecha</label>
      <div class="lh-field__control">
        <ion-input
          type="date"
          [(ngModel)]="entryDate"
        ></ion-input>
      </div>
    </div>

    <div class="lh-field">
      <label class="lh-field__label">ID del participante (opcional)</label>
      <div class="lh-field__control">
        <ion-input
          [(ngModel)]="participantId"
          placeholder="UUID del participante"
        ></ion-input>
      </div>
    </div>

    <ion-button
      expand="block"
      class="save-btn"
      (click)="save()"
      [disabled]="loading || !content.trim()"
    >
      <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
      {{ isEdit ? 'Actualizar entrada' : 'Crear entrada' }}
    </ion-button>
  </div>
</ion-content>
