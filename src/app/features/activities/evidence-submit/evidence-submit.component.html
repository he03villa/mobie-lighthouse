<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/activities" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Enviar Evidencia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    <div class="form-section surface-panel">
      <h3 class="section-title">Descripcion</h3>
      <ion-textarea
        [(ngModel)]="textContent"
        placeholder="Describe la evidencia que deseas enviar..."
        [rows]="6"
        class="form-textarea"
      ></ion-textarea>
    </div>

    <div class="form-section surface-panel">
      <h3 class="section-title">Archivos adjuntos</h3>

      <div class="attachment-actions">
        <ion-button fill="outline" class="attach-btn">
          <ion-icon name="cameraOutline" slot="start"></ion-icon>
          Foto
        </ion-button>
        <ion-button fill="outline" class="attach-btn">
          <ion-icon name="documentAttachOutline" slot="start"></ion-icon>
          Archivo
        </ion-button>
      </div>

      <input
        #fileInput
        type="file"
        multiple
        accept="image/*,video/*,audio/*,.pdf,.doc,.docx"
        (change)="onFileSelected($event)"
        class="file-input"
      />

      @if (files.length > 0) {
        <div class="file-list">
          @for (file of files; track $index; let i = $index) {
            <div class="file-preview">
              <ion-icon
                [name]="
                  file.type.startsWith('image/')
                    ? 'image-outline'
                    : file.type.startsWith('video/')
                      ? 'videocam-outline'
                      : file.type.startsWith('audio/')
                        ? 'mic-outline'
                        : 'document-text-outline'
                "
                color="primary"
              ></ion-icon>
              <div class="file-info">
                <span class="file-name">{{ file.name }}</span>
                <span class="file-size">{{ (file.size / 1024) | number:'1.0-0' }} KB</span>
              </div>
              <ion-button fill="clear" size="small" (click)="removeFile(i)" color="danger">
                <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </div>
          }
        </div>
      }
    </div>

    <div class="action-area">
      <ion-button
        expand="block"
        (click)="submit()"
        [disabled]="loading"
        class="submit-btn"
      >
        @if (loading) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
          Enviando...
        } @else {
          <ion-icon name="sendOutline" slot="start"></ion-icon>
          Enviar evidencia
        }
      </ion-button>
    </div>
  </div>
</ion-content>
