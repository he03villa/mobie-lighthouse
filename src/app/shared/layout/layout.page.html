<ion-app>
  @if (isCoach) {
    <div class="coach-layout">
      <header class="coach-header">
        @if (isRootPage) {
          <button class="menu-btn" (click)="toggleSidebar()">
            <ion-icon name="menu-outline"></ion-icon>
          </button>
        } @else {
          <button class="menu-btn" (click)="goBack()">
            <ion-icon name="arrow-back-outline"></ion-icon>
          </button>
        }
        <span class="header-title">Lighthouse</span>
      </header>

      <div class="sidebar-backdrop"
           [class.visible]="sidebarOpen"
           (click)="closeSidebar()"></div>

      <aside class="sidebar" [class.open]="sidebarOpen">
        <div class="sidebar-header">
          <div class="avatar">{{ userInitial }}</div>
          <div class="user-info">
            <h3>{{ user?.name ?? 'Usuario' }}</h3>
            <p>{{ activeTenant?.name ?? 'Organizacion' }}</p>
            <span class="role-badge">{{ roleLabel }}</span>
          </div>
          <button class="close-btn" (click)="closeSidebar()">
            <ion-icon name="close-outline"></ion-icon>
          </button>
        </div>

        <nav class="sidebar-nav">
          <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebar()">
            <ion-icon name="home-outline"></ion-icon>
            <span>Dashboard</span>
          </a>
          <a class="nav-item" routerLink="/activities" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="list-outline"></ion-icon>
            <span>Actividades</span>
          </a>
          <a class="nav-item" routerLink="/journal" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="document-text-outline"></ion-icon>
            <span>Diario</span>
          </a>
          <a class="nav-item" routerLink="/planning" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="calendar-outline"></ion-icon>
            <span>Planificacion</span>
          </a>
          <a class="nav-item" routerLink="/billing" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="wallet-outline"></ion-icon>
            <span>Facturacion</span>
          </a>
          <a class="nav-item" routerLink="/participants" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="people-outline"></ion-icon>
            <span>Participantes</span>
          </a>
          <a class="nav-item" routerLink="/programs" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="school-outline"></ion-icon>
            <span>Programas</span>
          </a>
          <a class="nav-item" routerLink="/field-notes" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="create-outline"></ion-icon>
            <span>Notas de Campo</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <a class="nav-item" routerLink="/profile" routerLinkActive="active" (click)="closeSidebar()">
            <ion-icon name="person-outline"></ion-icon>
            <span>Perfil</span>
          </a>
          <button class="nav-item logout" (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon>
            <span>Cerrar sesion</span>
          </button>
        </div>
      </aside>

      <main class="coach-main">
        <ion-router-outlet></ion-router-outlet>
      </main>

      <button class="fab" [style.display]="showFab ? 'flex' : 'none'" (click)="fabAction()">
        <ion-icon name="add-outline"></ion-icon>
      </button>
    </div>
  } @else {
    <div class="mobile-layout">
      <ion-router-outlet></ion-router-outlet>

      <nav class="bottom-nav">
        <button class="nav-btn" (click)="navigateTo('/dashboard')">
          <ion-icon name="home-outline"></ion-icon>
          <span>Inicio</span>
        </button>
        <button class="nav-btn" (click)="navigateTo('/activities')">
          <ion-icon name="list-outline"></ion-icon>
          <span>Actividades</span>
        </button>
        <button class="nav-btn" (click)="navigateTo('/journal')">
          <ion-icon name="document-text-outline"></ion-icon>
          <span>Diario</span>
        </button>
        <button class="nav-btn" (click)="navigateTo('/planning')">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>Planificacion</span>
        </button>
        <button class="nav-btn" (click)="navigateTo('/profile')">
          <ion-icon name="person-outline"></ion-icon>
          <span>Perfil</span>
        </button>
        <button class="nav-btn logout-btn" (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Salir</span>
        </button>
      </nav>
    </div>
  }
</ion-app>
